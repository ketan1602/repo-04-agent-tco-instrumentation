<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eval - ENG-07: The Cost of an Agent Is NOT Tokens</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<nav class="nav">
  <a class="nav-brand" href="/">ENG-07 Agent Cost</a>
  <div class="nav-links">
    <a href="/">Overview</a>
    <a href="/demo">Demo</a>
    <a href="/metrics">Metrics</a>
    <a href="/eval">Eval</a>
  </div>
</nav>
<main class="container">
  <div class="page-header">
    <h1>Scenario cases</h1>
    <p class="text-muted">The 16 support-agent cases. Each runs on the direct and the harnessed path.</p>
  </div>
  <div class="card"><div class="card-title">By category</div><div id="summary" class="loading">Loading...</div></div>
  <div class="card"><div class="card-title">Cases</div><div id="cases" class="loading">Loading...</div></div>
</main>
<script src="/static/app.js"></script>
<script>
fetchJson('/api/eval/cases').then(({ body }) => {
  setHtml('summary', `<table><thead><tr><th>Category</th><th>Cases</th></tr></thead><tbody>${
    Object.entries(body.categories).map(([c, n]) => `<tr><td>${esc(c)}</td><td>${n}</td></tr>`).join('')
  }</tbody></table>`);
  setHtml('cases', `<table><thead><tr><th>Case</th><th>Category</th><th>Control</th><th>Expected</th><th>Violation</th></tr></thead><tbody>${
    body.cases.map(c => `<tr><td class="mono">${esc(c.id)}</td><td>${esc(c.category)}</td><td>${esc(c.control)}</td>
      <td>${esc(c.expected)}</td><td>${esc(c.violation || 'none')}</td></tr>`).join('')
  }</tbody></table>`);
}).catch(() => setText('cases', 'Could not load the cases.'));
</script>
</body>
</html>
