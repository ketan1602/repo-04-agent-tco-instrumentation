<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metrics - ENG-07: The Cost of an Agent Is NOT Tokens</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<nav class="nav">
  <a class="nav-brand" href="/">ENG-07 Agent Cost</a>
  <div class="nav-links">
    <a href="/">Overview</a>
    <a href="/demo">Demo</a>
    <a href="/metrics">Metrics</a>
    <a href="/eval">Eval</a>
  </div>
</nav>
<main class="container">
  <div class="page-header">
    <h1>Cost per successful run</h1>
    <p class="text-muted">Tokens are <strong>measured</strong>. Every other price is <strong>assumed</strong>. <span id="model"></span></p>
  </div>
  <div id="banner"></div>
  <div id="content" style="display:none">
    <div class="stat-grid" id="stats"></div>
    <div class="alert alert-info" id="breakeven-note"></div>
    <div class="card"><h2>Where the money goes</h2><div id="charts" class="charts"></div></div>
    <div class="card"><h2>Remediation sweep</h2>
      <p class="text-muted small">Cost per success as the assumed cost of one violation changes.</p><div id="sweep"></div></div>
    <div class="card"><h2>Inputs</h2><div id="assumptions"></div></div>
    <div class="card"><h2>Limits</h2><ul id="limits"></ul></div>
  </div>
</main>
<script src="/static/app.js"></script>
<script>
const ROW = (k, v, kind) => `<tr><td>${k}</td><td class="num">${v}</td><td><span class="tag tag-${kind}">${kind}</span></td></tr>`;
function breakevenText(v) {
  if (v === null || v === undefined) return 'Breakeven remediation: never. The harness is not cheaper at any remediation price.';
  if (v === 0) return 'Breakeven remediation: $0. The harness is cheaper per success even if a violation cost nothing to remediate.';
  return `Breakeven remediation: ${usd(v)} per violation. Above that, the harness is cheaper per success; below it, the direct path is.`;
}
function render(d) {
  setText('model', 'Model: ' + d.model);
  const a = d.assumptions, p = a.platform, dr = d.direct, h = d.harnessed;
  setHtml('stats',
    statCard(usd(dr.cost_per_success_usd), 'Cost per success, direct', `${dr.successes}/${dr.runs} succeeded`, 'text-error') +
    statCard(usd(h.cost_per_success_usd), 'Cost per success, harnessed', `${h.successes}/${h.runs} succeeded`, 'text-success') +
    statCard(dr.violations, 'Violations, direct', `of ${dr.runs} runs`, 'text-error') +
    statCard(h.violations, 'Violations, harnessed', `${h.vetoed} vetoed, ${h.escalated} escalated, ${h.retried} retried`, 'text-success') +
    statCard(usd(d.breakeven_remediation_usd, 'never'), 'Breakeven remediation', 'per violation', 'text-accent'));
  setText('breakeven-note', breakevenText(d.breakeven_remediation_usd));
  setHtml('charts', d.charts.direct + d.charts.harnessed);
  setHtml('sweep', `<table><thead><tr><th>Remediation per violation</th><th>Direct, per success</th><th>Harnessed, per success</th></tr></thead><tbody>${
    d.remediation_sweep.map(s => `<tr><td class="num">${usd(s.remediation_per_violation_usd)}</td>
      <td class="num">${usd(s.direct_cost_per_success_usd)}</td><td class="num">${usd(s.harnessed_cost_per_success_usd)}</td></tr>`).join('')
  }</tbody></table>`);
  setHtml('assumptions', `<table><thead><tr><th>Input</th><th>Value</th><th>Source</th></tr></thead><tbody>
    ${ROW('Tokens, direct', dr.tokens, 'measured')}
    ${ROW('Tokens, harnessed', h.tokens, 'measured')}
    ${ROW('Runs per path', d.runs_per_arm, 'measured')}
    ${ROW('Token price per 1k', usd(a.token_price_per_1k), 'assumed')}
    ${ROW('Runtime per run', usd(p.runtime_per_run), 'assumed')}
    ${ROW('Observability per run (harness only)', usd(p.observability_per_run), 'assumed')}
    ${ROW('Control per run (harness only)', usd(p.control_per_run), 'assumed')}
    ${ROW('Approval time (minutes)', a.approval_minutes, 'assumed')}
    ${ROW('Reviewer rate per hour', usd(a.reviewer_rate_per_hour), 'assumed')}
    ${ROW('Approval cost', usd(a.approval_cost_usd), 'assumed')}
    ${ROW('Remediation per violation', usd(a.remediation_per_violation), 'assumed')}
    ${ROW('Cost center', esc(a.cost_center), 'assumed')}
  </tbody></table>`);
  setHtml('limits', d.limits.map(l => `<li>${esc(l)}</li>`).join(''));
  $('content').style.display = '';
}
fetch('/api/metrics').then(r => r.json()).then(d => {
  if (d.no_data) {
    setHtml('banner', `<div class="alert alert-warning">No cost results yet. Run:<br>${
      d.seed_commands.map(c => `<code>${esc(c)}</code>`).join('<br>')}</div>`);
    return;
  }
  render(d);
}).catch(() => setHtml('banner', '<div class="alert alert-error">Could not load /api/metrics.</div>'));
</script>
</body>
</html>
