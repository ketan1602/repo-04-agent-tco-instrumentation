<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo — Legal Contract Review</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<nav class="nav">
  <a class="nav-brand" href="/">Agent TCO</a>
  <div class="nav-links">
    <a href="/">Overview</a>
    <a href="/demo">Demo</a>
    <a href="/metrics">Metrics</a>
    <a href="/eval">Eval</a>
  </div>
</nav>
<main class="container">
  <div class="page-header">
    <h1>Legal Contract Review</h1>
    <p class="text-muted">Submit a contract. See the risk assessment plus the full TCO breakdown for this single run.</p>
  </div>

  <div class="card">
    <h3>Contract Submission</h3>
    <form id="contract-form" method="post" action="/demo">
      <div class="grid-2">
        <div class="form-group">
          <label for="vendor_name">Vendor Name</label>
          <input type="text" id="vendor_name" name="vendor_name" value="Acme Software Ltd" required>
        </div>
        <div class="form-group">
          <label for="contract_type">Contract Type</label>
          <select id="contract_type" name="contract_type">
            <option value="service" selected>Service Agreement</option>
            <option value="supply">Supply Agreement</option>
            <option value="nda">NDA</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="page_count">Page Count</label>
        <input type="number" id="page_count" name="page_count" value="24" min="1" max="500">
      </div>
      <input type="hidden" name="contract_id" value="CTR-DEMO-001">
      <div class="form-group">
        <label for="text_sample">Contract Text Sample (first ~2000 chars)</label>
        <textarea id="text_sample" name="text_sample" rows="8" required>This Agreement shall automatically renew for successive one-year terms unless either party provides written notice of non-renewal at least 180 days prior to the end of the then-current term. Vendor may increase fees by up to 15% per annum without consent. Vendor retains all intellectual property created under this Agreement. Client waives the right to participate in any class action relating to this Agreement. Disputes shall be resolved exclusively by arbitration in Delaware, USA under AAA Commercial Arbitration Rules.</textarea>
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn">Review Contract</button>
    </form>
  </div>

  <div id="result-area" style="margin-top:20px"></div>
</main>
<script src="/static/app.js"></script>
<script>
  const form = document.getElementById('contract-form');
  const resultArea = document.getElementById('result-area');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async e => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Reviewing…';
    resultArea.innerHTML = '<p class="loading">Invoking contract review agent…</p>';

    try {
      const resp = await fetch('/demo', { method: 'POST', body: new FormData(form) });
      const json = await resp.json();
      if (json.success && json.output) {
        const o = json.output;
        resultArea.innerHTML = `
          <div class="card">
            <h3>Risk Assessment</h3>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
              ${riskBadge(o.overall_risk)}
              <span class="badge" style="background:var(--border)">${o.flag_count} flag${o.flag_count !== 1 ? 's' : ''}</span>
              ${o.requires_legal_review ? '<span class="badge badge-high">Legal review required</span>' : '<span class="badge badge-acceptable">No legal review needed</span>'}
            </div>
            <p>${o.summary}</p>
            <p class="text-muted" style="margin-top:8px">Estimated review time: ${o.estimated_review_minutes} minutes</p>
          </div>
          <div class="card">
            <h3>TCO Breakdown — This Run</h3>
            ${tcoTable(json.tco_breakdown)}
          </div>
          <div class="card">
            <div class="card-title">Harness Metadata</div>
            <div class="stat-grid">
              <div><span class="text-muted">Run ID</span><br><code style="font-size:11px">${json.run_id}</code></div>
              <div><span class="text-muted">Duration</span><br>${json.duration_ms}ms</div>
              <div><span class="text-muted">Token cost</span><br>$${(json.cost_usd || 0).toFixed(5)}</div>
            </div>
          </div>`;
      } else {
        resultArea.innerHTML = `<div class="alert alert-error">Error: ${json.error || 'Unknown failure'}</div>`;
      }
    } catch (err) {
      resultArea.innerHTML = `<div class="alert alert-error">Request failed: ${err.message}</div>`;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Review Contract';
    }
  });
</script>
</body>
</html>
