<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo - ENG-07: The Cost of an Agent Is NOT Tokens</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<nav class="nav">
  <a class="nav-brand" href="/">ENG-07 Agent Cost</a>
  <div class="nav-links">
    <a href="/">Overview</a>
    <a href="/demo">Demo</a>
    <a href="/metrics">Metrics</a>
    <a href="/eval">Eval</a>
  </div>
</nav>
<main class="container">
  <div class="page-header">
    <h1>Run one case live</h1>
    <p class="text-muted">Calls the real model once per path, then costs both paths. Tokens are measured; prices are assumed.</p>
  </div>
  <div class="card">
    <div class="form-group"><label for="case">Case</label><select id="case"></select></div>
    <div id="utterance" class="text-muted small" style="margin-bottom:12px"></div>
    <button class="btn btn-primary" id="run">Run case</button>
  </div>
  <div id="error"></div>
  <div id="result" class="grid-2"></div>
</main>
<script src="/static/app.js"></script>
<script>
let cases = [];
function showUtterance() {
  const c = cases.find(x => x.id === $('case').value);
  setText('utterance', c ? c.utterance : '');
}
function column(name, r, extra) {
  const tone = r.success ? 'text-success' : 'text-error';
  return `<div class="card"><h3>${name}</h3>
    <p class="${tone}">${r.success ? 'success' : 'not a success'}${r.violated ? ' - policy violated' : ''}</p>
    <table><tbody><tr><td>status</td><td>${esc(r.status)}</td></tr>
    <tr><td>tokens (measured)</td><td>${esc(r.tokens)}</td></tr>${extra}</tbody></table>
    <div class="card-title" style="margin-top:12px">Cost (assumed prices)</div>${breakdownTable(r.cost_usd)}
    <p style="margin-top:8px"><strong>Total ${usd(r.total_usd)}</strong></p></div>`;
}
$('run').addEventListener('click', async () => {
  setHtml('error', ''); setHtml('result', '<div class="loading">Running both paths...</div>');
  $('run').disabled = true;
  try {
    const { ok, body } = await fetchJson('/api/demo/run', { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ case_id: $('case').value }) });
    if (!ok) { setHtml('result', ''); setHtml('error', `<div class="alert alert-error">${esc(body.error || 'Run failed')}</div>`); return; }
    const h = body.harnessed;
    setHtml('result', column('Direct (no harness)', body.direct, '') + column('Harnessed', h,
      `<tr><td>vetoed</td><td>${h.vetoed}</td></tr><tr><td>escalated</td><td>${h.escalated}</td></tr><tr><td>retried</td><td>${h.retried}</td></tr>`));
  } catch (e) { setHtml('result', ''); setHtml('error', '<div class="alert alert-error">Request failed.</div>'); }
  finally { $('run').disabled = false; }
});
fetch('/api/demo/cases').then(r => r.json()).then(list => {
  cases = list;
  setHtml('case', list.map(c => `<option value="${esc(c.id)}">${esc(c.id)}</option>`).join(''));
  showUtterance();
});
$('case').addEventListener('change', showUtterance);
</script>
</body>
</html>
