harness:
  max_retry_attempts: 3
  retry_strategy: exponential
  retry_base_delay_seconds: 1.0
  retry_max_delay_seconds: 30.0
  retryable_errors:
    - RateLimitError
    - APITimeoutError
    - APIConnectionError
  run_timeout_seconds: 120
  audit_enabled: true
  cost_tracking_enabled: true
  input_price_per_m_tokens: 3.00
  output_price_per_m_tokens: 15.00

model:
  name: ${AIR_MODEL:-openai/gpt-oss-120b}
  temperature: 0.1
  max_tokens: 1024

agent:
  name: legal-contract-review-agent
  version: "1.0.0"
  owner: legal-ops-team
